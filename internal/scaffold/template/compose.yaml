name: basestack-__PROJECT_NAME__-__COMPOSE_ID__
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: basestack
      POSTGRES_DB: basestack
      POSTGRES_PASSWORD: ${BASESTACK_DB_PASSWORD:?Run basestack services start or supply local credentials}
    ports:
      - "127.0.0.1:${BASESTACK_DATABASE_PORT:-54322}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U basestack -d basestack"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
volumes:
  postgres_data:

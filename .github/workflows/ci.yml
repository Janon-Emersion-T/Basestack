name: BaseStack CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify CLI, PostgreSQL runtime and generated frontend
        # The script creates private random credentials, provisions Compose,
        # runs real PostgreSQL integration tests and stops its containers.
        run: scripts/verify-generated.sh "$RUNNER_TEMP/basestack-verification"
      - uses: actions/upload-artifact@v4
        with:
          name: basestack-linux-amd64
          path: ${{ runner.temp }}/basestack-verification/basestack
      - uses: actions/upload-artifact@v4
        with:
          name: basestack-demo
          path: ${{ runner.temp }}/basestack-verification/smoke-app/dist
